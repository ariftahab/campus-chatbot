# learning_log/ veya experiment log değişen her push'ta Notion sayfalarını günceller.
# Gerekli repo secret'ları: NOTION_TOKEN, NOTION_PARENT_PAGE_ID (Settings → Secrets and variables → Actions).
# Secret'lar yoksa script hiçbir şey yapmadan başarıyla biter.
name: Notion sync

on:
  push:
    paths:
      - "learning_log/**"
      - "experiments/experiment_log.md"
      - "tools/notion_sync.py"
  workflow_dispatch: {}  # Actions sekmesinden elle de çalıştırılabilir

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.5
      - run: python tools/notion_sync.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
