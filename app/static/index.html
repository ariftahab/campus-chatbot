<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAİBÜ Kampüs Asistanı</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- marked: markdown -> HTML, DOMPurify: HTML temizleme (XSS koruması). Sürümler sabit. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="/static/common.js" defer></script>
  <script src="/static/chat.js" defer></script>
</head>
<body class="chat-body">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">BAİBÜ Kampüs Asistanı<small>mevzuat asistanı</small></div>
      <nav class="nav">
        <a href="/" class="active">Sohbet</a>
        <a href="/belgeler">Belgeler</a>
        <a href="/admin">Değerlendirme</a>
      </nav>
      <div class="status"></div>
    </div>
  </header>

  <main class="chat-page">
    <div class="messages" id="messages">
      <div class="messages-inner" id="messages-inner">
        <div class="empty" id="empty">
          <h1>Ne öğrenmek istersiniz?</h1>
          <div>Üniversitenin yönetmelik ve yönergelerine göre cevap verir, kaynağını gösterir.</div>
          <div class="examples">
            <button>Yatay geçiş başvurusu için not ortalaması şartı nedir?</button>
            <button>Bir dersten devamsızlık sınırı ne kadar?</button>
            <button>Kayıt dondurma hangi durumlarda yapılabilir?</button>
          </div>
        </div>
      </div>
    </div>

    <form class="composer" id="composer">
      <div class="composer-inner">
        <textarea id="question" rows="1" placeholder="Sorunuzu yazın…" aria-label="Soru"></textarea>
        <button class="btn btn-primary" id="send" type="submit">Gönder</button>
      </div>
      <div class="composer-hint">
        <span>Enter: gönder · Shift+Enter: yeni satır</span>
        <button class="link-btn" id="new-chat" type="button">Yeni sohbet</button>
      </div>
    </form>
  </main>
</body>
</html>
